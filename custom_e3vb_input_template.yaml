expected_generated_artifacts:
  # The converter can emit an E3VB-compatible .xmi with:
  # - $ctrl: at least `nae` and `nao`
  # - $geo: `symbol x y z`
  # - $orb: one ignored header line, then one line per orbital
  xmi_path: /tmp/example_10698.e3vb.xmi
  str_path: /tmp/example_10698.e3vb.str
  prediction_output_path: /tmp/example_10698.predictions.tsv
